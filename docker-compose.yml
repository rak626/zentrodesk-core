services:
  postgres:
    image: postgres:16-alpine
    container_name: zentro-desk-postgres
    restart: always
    environment:
      POSTGRES_DB: zentro_desk_db
      POSTGRES_USER: rakesh
      POSTGRES_PASSWORD: rakesh123_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: