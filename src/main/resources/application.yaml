spring:
  application:
    name: zentrodesk

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}

  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false
    encoding: UTF-8
    default-schema: zentro_desk
    create-schemas: true
    locations: classpath:db/migration

  jpa:
    properties:
      hibernate:
        default_schema: zentro_desk
    open-in-view: false
server:
  port: ${PORT:6060}
  forward-headers-strategy: framework
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  packages-to-scan: com.rakesh.zentrodesk
  paths-to-match: /api/app/**, /api/platform/**

app:
  quotation:
    pdf-processing-enabled: ${QUOTATION_PDF_PROCESSING_ENABLED:true}
    pdf-processing-interval: ${QUOTATION_PDF_PROCESSING_INTERVAL_MS:2000}
    pdf-max-attempts: ${QUOTATION_PDF_MAX_ATTEMPTS:5}
    default-whatsapp-template-name: ${WHATSAPP_QUOTATION_TEMPLATE_NAME:quotation_document}
    default-whatsapp-template-language: ${WHATSAPP_QUOTATION_TEMPLATE_LANGUAGE:en}
  observability:
    metrics-token: ${METRICS_TOKEN:}
  security:
    jwt:
      secret: ${JWT_SECRET:r23412319923042342342342312312312123123112312}
      previous-secret: ${JWT_PREVIOUS_SECRET:3we42342342345fg234f23423423fdfsf24324}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
