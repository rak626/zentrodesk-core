spring:
  application:
    name: zentrodesk
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false
    encoding: UTF-8
    default-schema: zentro_desk
    create-schemas: true
    locations: classpath:db/migration

  jpa:
    properties:
      hibernate:
        default_schema: zentro_desk
    open-in-view: false
server:
  port: ${PORT:6060}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-zentrodesk-jwt-secret-change-before-production}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
