spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zentro_desk_db}
    username: ${DB_USER:zentrodesk}
    password: ${DB_PASSWORD:zentrodesk}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

app:
  flyway:
    seed:
      enabled: true
      locations: classpath:db/seed/dev

  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-with-at-least-32-characters}

  email:
    base-url: ${APP_BASE_URL:http://localhost:3000}
    token-encryption-key: ${EMAIL_TOKEN_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    dispatch-enabled: true
