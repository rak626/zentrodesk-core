spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zentro_desk_db}
    username: ${DB_USER:zentrodesk}
    password: ${DB_PASSWORD:zentrodesk}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

app:
  flyway:
    seed:
      enabled: true
      locations: classpath:db/seed/dev

  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-with-at-least-32-characters}

  email:
    base-url: ${APP_BASE_URL:http://localhost:3000}
    token-encryption-key: ${EMAIL_TOKEN_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    dispatch-enabled: true
  whatsapp:
    app-id: ${META_APP_ID:dev-meta-app-id}
    app-secret: ${META_APP_SECRET:dev-whatsapp-app-secret}
    embedded-signup-config-id: ${META_EMBEDDED_SIGNUP_CONFIG_ID:dev-embedded-signup-config-id}
    graph-version: ${META_GRAPH_API_VERSION:v23.0}
    token-encryption-key: ${WHATSAPP_TOKEN_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:dev-whatsapp-verify-token}
    webhook-public-url: ${WHATSAPP_WEBHOOK_PUBLIC_URL:http://localhost:6060/api/webhooks/whatsapp}
    dispatch-enabled: ${WHATSAPP_DISPATCH_ENABLED:false}
    webhook-processing-enabled: true
