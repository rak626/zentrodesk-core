name: backend-ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit, integration, migration, architecture, and coverage gates
        run: ./mvnw -B verify -Pintegration
      - name: Dependency and secret scan
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: target/trivy-fs.sarif
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          if-no-files-found: warn
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/trivy-fs.sarif

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build reproducible runtime image
        run: docker build --pull --tag zentrodesk-core:ci .
      - name: Assert non-root runtime user
        run: test "$(docker image inspect zentrodesk-core:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: zentrodesk-core:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: target/trivy-image.sarif
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: zentrodesk-core:ci
          format: cyclonedx-json
          output-file: target/backend-sbom.cdx.json
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-container
          if-no-files-found: warn
          path: |
            target/trivy-image.sarif
            target/backend-sbom.cdx.json

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
